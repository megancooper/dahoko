name: Semantic release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 8.15.6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm verify

      - name: Check native code
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.semantic.outputs.released }}
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 8.15.6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      - name: Publish semantic release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "released=false" >> "$GITHUB_OUTPUT"
          pnpm exec semantic-release

  desktop:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  android:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-android.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
