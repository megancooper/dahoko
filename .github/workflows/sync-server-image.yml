name: Sync server container

on:
  pull_request:
    paths:
      - ".github/workflows/sync-server-image.yml"
      - ".dockerignore"
      - "apps/sync-server/**"
      - "packages/typescript-config/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  push:
    branches:
      - main
    tags:
      - "app-v*"
    paths:
      - ".github/workflows/sync-server-image.yml"
      - ".dockerignore"
      - "apps/sync-server/**"
      - "packages/typescript-config/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/dahoko-sync
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=app-v(.*),group=1
            type=sha
          labels: |
            org.opencontainers.image.title=Dahoko encrypted sync server
            org.opencontainers.image.description=Opaque end-to-end encrypted sync storage for Dahoko
            org.opencontainers.image.licenses=MIT

      - name: Build and publish
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/sync-server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: container
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: sync-server-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1

      # Syncs the server's runtime secrets from Infisical into Fly (staged,
      # so they apply atomically with the deploy), then deploys the freshly
      # published image. A no-op until the FLY_API_TOKEN secret exists.
      - name: Sync secrets from Infisical and deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID || '59b3e1c1-4338-4718-8485-79823cb3aca5' }}
          INFISICAL_ENV: ${{ vars.INFISICAL_ENV || 'prod' }}
        working-directory: apps/sync-server
        run: |
          set -euo pipefail
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "No FLY_API_TOKEN secret; skipping deploy."
            exit 0
          fi
          if [ -z "$INFISICAL_CLIENT_ID" ] || [ -z "$INFISICAL_CLIENT_SECRET" ]; then
            echo "::error::INFISICAL_CLIENT_ID and INFISICAL_CLIENT_SECRET secrets are required to sync Fly secrets."
            exit 1
          fi
          npm install --global @infisical/cli
          INFISICAL_TOKEN=$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --silent --plain)
          export INFISICAL_TOKEN

          KEYS="DAHOKO_ACCOUNT_HASH_KEY DATABASE_URL STRIPE_SECRET_KEY \
            STRIPE_WEBHOOK_SECRET STRIPE_PRICE_ID_PRO_MONTHLY \
            STRIPE_PRICE_ID_PRO_YEARLY DAHOKO_BILLING_SUCCESS_URL \
            DAHOKO_BILLING_CANCEL_URL"
          : > .fly-secrets
          missing=""
          for key in $KEYS; do
            value=$(infisical secrets get "$key" \
              --projectId "$INFISICAL_PROJECT_ID" \
              --env "$INFISICAL_ENV" --plain 2>/dev/null || true)
            if [ -z "$value" ]; then
              missing="$missing $key"
            else
              printf '%s=%s\n' "$key" "$value" >> .fly-secrets
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing in Infisical env '$INFISICAL_ENV':$missing"
            rm -f .fly-secrets
            exit 1
          fi
          flyctl secrets import --stage < .fly-secrets
          rm -f .fly-secrets
          flyctl deploy --image "ghcr.io/${GITHUB_REPOSITORY_OWNER}/dahoko-sync:latest"
