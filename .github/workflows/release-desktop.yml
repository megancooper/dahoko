name: Publish desktop

on:
  workflow_call:
    inputs:
      version:
        description: Exact SemVer to build from its app-v tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer whose app-v tag should be published
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      release_body: ${{ steps.release.outputs.body }}
    steps:
      - name: Resolve existing semantic release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be an exact stable SemVer such as 1.2.3."
            exit 1
          fi

          release_endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/app-v${RELEASE_VERSION}"
          release_id="$(gh api "$release_endpoint" --jq ".id")"
          delimiter="release_body_$(openssl rand -hex 16)"

          {
            echo "id=$release_id"
            echo "body<<$delimiter"
            gh api "$release_endpoint" --jq ".body"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      VITE_DAHOKO_SYNC_URL: ${{ vars.DAHOKO_SYNC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: app-v${{ inputs.version }}

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 8.15.6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Synchronize release version
        run: node scripts/set-version.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web applications
        run: pnpm build

  validate-signing:
    runs-on: ubuntu-latest
    steps:
      - name: Verify updater secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is required"
            exit 1
          }
          test -n "$TAURI_UPDATER_PUBKEY" || {
            echo "TAURI_UPDATER_PUBKEY is required"
            exit 1
          }

  publish:
    needs:
      - resolve-release
      - verify
      - validate-signing
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      VITE_DAHOKO_SYNC_URL: ${{ vars.DAHOKO_SYNC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: app-v${{ inputs.version }}

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 8.15.6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Synchronize release version
        run: node scripts/set-version.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exports POSTHOG_PROJECT_TOKEN / POSTHOG_PROJECT_ID / POSTHOG_HOST /
      # POSTHOG_CLI_TOKEN (and anything else in the environment) as masked
      # env vars for the build. Skipped until the machine identity bootstrap
      # secrets exist in GitHub; the build then runs with telemetry off.
      - name: Fetch telemetry secrets from Infisical
        if: ${{ secrets.INFISICAL_CLIENT_ID != '' }}
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG || 'prod' }}

      - uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.resolve-release.outputs.release_id }}
          tagName: app-v__VERSION__
          releaseBody: ${{ needs.resolve-release.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
