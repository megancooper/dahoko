# Fly.io app for the hosted Dahoko sync server (sync.dahoko.com).
# Stateless: all data lives in Neon Postgres via DATABASE_URL, so machines
# can be replaced freely. Secrets come from `fly secrets set`, not this file.
app = "dahoko-sync"
primary_region = "sjc"

[build]
image = "ghcr.io/megancooper/dahoko-sync:latest"

[env]
HOST = "0.0.0.0"
PORT = "8787"
DAHOKO_TRUST_PROXY = "true"
DAHOKO_SYNC_ORIGINS = "tauri://localhost,http://tauri.localhost,https://dahoko.com"

[http_service]
internal_port = 8787
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "10s"
method = "GET"
path = "/health"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
